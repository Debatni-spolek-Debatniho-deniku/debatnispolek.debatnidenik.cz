committeeIntro: >-
  Debatní výbor je statutárním orgánem Debatního spolku Debatního deníku volený debatní schůzí.
  Členové debatního výboru zastupují spolek vůči třetím osobám a řídí běžný chod spolku.
  Působnost členů debatního výboru je rozdělena do různých oblastí působení.
  Vedoucí debatních poboček zastupují spolek v lokálních otázkách a řídí aktivity spolku v dané lokalitě.

