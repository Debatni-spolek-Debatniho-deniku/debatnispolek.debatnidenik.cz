activities:
  badge: "Aktivity"
  title: "Naše aktivity"
  lead: "Co všechno děláme a kde nás potkáte."
  items:
    - icon: "bi-trophy-fill"
      title: "Plzeň Open 2025"
      text: >-
        Ve dnech 22.–23. listopadu 2025 se uskutečnil debatní turnaj Plzeň Open,
        na kterém své debatní schopnosti poměřili debatéři z našeho spolku i účastníci
        z dalších debatních klubů. Součástí organizačního týmu byla také equity,
        jejíž roli na turnaji zastávaly dvě členky našeho TEA týmu – Barbora a Michaela.
        Jejich úkolem bylo dohlížet na to, aby turnaj probíhal v respektujícím
        a bezpečném prostředí pro všechny účastníky.
    - icon: "bi-people-fill"
      title: "Debatní kluby"
      text: >-
        Náš TEA tým dochází na pravidelně pořádané debatní kluby, kde dohlíží
        na to, aby jejich průběh byl příjemný, bezpečný a férový pro všechny
        účastníky. Dbáme na to, aby nikdo nebyl diskriminován, šikanován nebo
        jinak vystaven nevhodnému chování. Zároveň jsme tu pro každého, kdo se
        během klubu necítí dobře, potřebuje něco řešit nebo si jen chce popovídat.

equityRole:
  badge: "Equity na turnaji"
  title: "Co dělá equity na turnaji?"
  text: !markdown |
    Debata je prostředí, kde se střetávají různé názory a setkávají se lidé s odlišnými zkušenostmi. **Equity tým se stará o to, aby se všichni účastníci mohli turnaje účastnit v bezpečném a respektujícím prostředí.** Řeší podněty a situace spojené například s nevhodným chováním, obtěžováním nebo diskriminací.

    Equity tým není rozhodčí a neposuzuje kvalitu debat. Jeho úkolem je pomáhat řešit problémy, které mohou během turnaje nastat, a dbát na to, aby se účastníci cítili bezpečně a respektovaně. Díky tomu se mohou debatéři soustředit na to nejdůležitější — **samotnou debatu**.

