hero:
  badge: "Tým pro Empatii a Asistenci"
  title: "Equity – TEA"
  lead: >-
    Nabízíme prostor pro neformální rozhovor, kde si můžeš otevřeně
    promluvit o svých problémech nebo obtížích. Můžeš se podělit o své
    pocity a my ti rádi poskytneme podporu, radu nebo jiný úhel pohledu.

intro:
  badge: "Kdo jsme"
  title: "Co pro tebe můžeme udělat?"
  lead: >-
    Naší rolí je naslouchat a nabídnout povzbuzení nebo praktické tipy,
    které ti mohou pomoci v dané chvíli.
  items:
    - icon: "bi-chat-heart-fill"
      title: "Nasloucháme"
      text: "Nabízíme prostor, kde si můžeš otevřeně promluvit o čemkoliv, co tě trápí. Bez hodnocení, bez tlaku."
    - icon: "bi-lightbulb-fill"
      title: "Radíme"
      text: "Poskytneme ti podporu, povzbuzení nebo jiný úhel pohledu, který ti může pomoci v dané chvíli."
    - icon: "bi-shield-check"
      title: "Chráníme"
      text: "Dohlížíme na to, aby prostředí spolku a jeho akcí bylo bezpečné, respektující a férové pro všechny."

disclaimer:
  title: "Důležité upozornění"
  text: >-
    Naše práce nenahrazuje odbornou psychologickou ani psychiatrickou pomoc.
    Pokud se cítíš dlouhodobě špatně, máš potíže s duševním zdravím nebo
    procházíš krizí, doporučujeme obrátit se na kvalifikované odborníky.
  kodexText: "Pracujeme podle našeho Kodexu"
  kodexLink: "#kodex"

contactMethods:
  badge: "Kontakt"
  title: "Jak se na nás můžeš obrátit?"
  lead: "Vyber si způsob, který ti nejvíce vyhovuje. Jsme tu pro tebe."
  items:
    - icon: "bi-person-fill"
      title: "Osobně"
      text: "Přijď si popovídat přímo s některým z členů komise. Neboj se oslovit kohokoliv z nás."
    - icon: "bi-pencil-square"
      title: "Formulářem"
      text: "Vyplň anonymní kontaktní formulář a my se ti ozveme."
      buttonText: "Otevřít formulář"
      buttonHref: "https://docs.google.com/forms/d/e/1FAIpQLScl_z9NigelEkPCHINsEJ6YL9fx076FzZ7V3JIJ4dEBZFgJsw/viewform"
    - icon: "bi-chat-dots-fill"
      title: "Discord nebo Instagram"
      text: "Napiš nám přes Discord nebo Instagram – kontakty najdeš u jednotlivých členů níže."

team:
  badge: "Náš tým"
  title: "Kdo za TEA stojí?"
  lead: "Poznej členy našeho týmu. Každý z nás je tu pro tebe."
  members:
    - name: "Will"
      image: "../clubs/owners/praha_svoboda.png"
      bio: >-
        Jsem nerd jak se patří – baví mě videohry, fantasy, dračák, deskovky i šerm.
        Prostě takovej mix všeho, co má trochu dobrodružný nebo herní vibe.
        Rád komunikuju na rovinu – občas až moc upřímně. Když se řeší nepříjemnosti,
        nejlíp mi to jde u čaje a nebo na procházce, kde se dá v klidu popovídat
        a něco vymyslet.
      discord: "NerdKing Will"
      discordNote: "jen bacha, někdy ho ignoruju"
      instagram: "Nameless_one.exe"
      instagramHref: "https://www.instagram.com/nameless_one.exe"
      instagramNote: "tady jsem mnohem aktivnější"
    - name: "Bára"
      image: ./Bara.jpg
      bio: >-
        Ve volném čase si užívám mátový čaj s medem, koukám na anime
        a poslouchám true crime podcasty. Amatérská zahradnice — občas zapomenu
        zalít květiny, a pak je zachraňuju. Mám zkušenosti ze studia i práce,
        takže dokážu chápat problémy z různých stran. Věřím, že nikdo by neměl
        být na svoje trápení sám. Snažím se dívat na věci z různých stran —
        žádný problém není moc malý nebo velký.
      discord: "dawn_2002"
      instagram: "dpc_barb"
      instagramHref: "https://instagram.com/dpc_barb"
    - name: "Michaela"
      image: ./Misa.png
      bio: >-
        Jsem studentkou práv a občas nesnesitelná perfekcionistka. Taky mám
        velmi špatný odhad – a to jak na vzdálenosti, tak na množství práce,
        kterou jsem schopná si na sebe naložit. Pokud máte podobný problém,
        myslím, že si budeme rozumět. Ve volném čase nejraději utíkám ke sportu,
        zejména k bojovým sportům, k pečení a knížkám. Pokud vás bude něco
        trápit nebo si budete chtít jen popovídat, neváhejte se na mě obrátit.
      discord: "kvapi"
      instagram: "m.kvpl"
      instagramHref: "https://instagram.com/m.kvpl"

